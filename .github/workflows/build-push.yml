name: Build and Push
on:
  push:
    paths:
      - 'helm/**'
      - 'src/**'
      - 'Dockerfile*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR Login Credentials
        id: acr
        run: |
          ACR_LOGIN_SERVER=$(az acr show --resource-group rg-aks-staging --name aksstagingacr6e4ced83 --query loginServer -o tsv)
          echo "login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
          
          ACR_UNAME=$(az acr credential show --resource-group rg-aks-staging --name aksstagingacr6e4ced83 --query "username" -o tsv)
          echo "username=$ACR_UNAME" >> $GITHUB_OUTPUT
          
          ACR_PASSWD=$(az acr credential show --resource-group rg-aks-staging --name aksstagingacr6e4ced83 --query "passwords[0].value" -o tsv)
          echo "password=$ACR_PASSWD" >> $GITHUB_OUTPUT

      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ steps.acr.outputs.login_server }}
          username: ${{ steps.acr.outputs.username }}
          password: ${{ steps.acr.outputs.password }}

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ steps.acr.outputs.login_server }}/frontend:latest -t ${{ steps.acr.outputs.login_server }}/frontend:${{ github.sha }} ./frontend || echo "frontend Dockerfile not found; skipping"
          docker push ${{ steps.acr.outputs.login_server }}/frontend:latest || echo "Frontend push skipped"
          docker push ${{ steps.acr.outputs.login_server }}/frontend:${{ github.sha }} || echo "Frontend push (with SHA) skipped"

      - name: Build and Push API Image
        run: |
          docker build -t ${{ steps.acr.outputs.login_server }}/api:latest -t ${{ steps.acr.outputs.login_server }}/api:${{ github.sha }} ./api || echo "api Dockerfile not found; skipping"
          docker push ${{ steps.acr.outputs.login_server }}/api:latest || echo "API push skipped"
          docker push ${{ steps.acr.outputs.login_server }}/api:${{ github.sha }} || echo "API push (with SHA) skipped"
