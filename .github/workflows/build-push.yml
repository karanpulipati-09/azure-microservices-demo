name: CI — Build and Push
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
  workflow_dispatch:

env:
  ACR_NAME: aksstagingacr6e4ced83
  ACR_LOGIN_SERVER: aksstagingacr6e4ced83.azurecr.io

jobs:
  build-push:
    name: Build and Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        app: [frontend, api]

    steps:
      - name: Check for required secrets
        run: |
          if [[ -z "${{ secrets.AZURE_CLIENT_ID }}" ]] || [[ -z "${{ secrets.AZURE_TENANT_ID }}" ]] || [[ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]]; then
            echo "::error::Missing required GitHub secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID"
            echo "See bootstrap/github-oidc-setup.md for setup instructions"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR (OIDC, no admin credentials)
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Get short SHA
        id: short-sha
        run: echo "SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:${{ steps.short-sha.outputs.SHA }} \
            apps/${{ matrix.app }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:${{ steps.short-sha.outputs.SHA }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Push to ACR
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.app }}:${{ steps.short-sha.outputs.SHA }}
