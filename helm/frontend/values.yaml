replicaCount: 2

image:
  registry: "aksstagingacr6e4ced83.azurecr.io"
  repository: "frontend"
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

serviceAccount:
  # Created separately by k8s/serviceaccounts-rbac.yaml, not by this chart
  create: false
  name: frontend-sa
