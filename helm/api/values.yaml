replicaCount: 2

image:
  registry: "aksstagingacr49bc2c25.azurecr.io"
  repository: "api"
  tag: "9c2aad2"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
